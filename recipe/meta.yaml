{% set name = "spacy-loggers" %}
{% set version = "1.0.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d60b0bdbf915a60e516cc2e653baeff946f0cfc461b452d11a4d5458c6fe5f24

build:
  number: 1
  skip: true  # [py<36]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

# E           logger.logger1 -> progress_bar	at root: 'true' is not <class 'bool'>
{% set deselect_tests = " --deselect=test_chain.py::test_load_from_config" %}

test:
  imports:
    - spacy_loggers
    # disabled on win-arm64 due to the missing spacy pkg for win-arm64 on main channel, remove those selector during the next rebuild/version bump once the win-arm64 pkg will be available
    - spacy_loggers.cupy  # [not (win and arm64)]
    - spacy_loggers.util  # [not (win and arm64)]
  requires:
    - pip
    - pytest
    - spacy  # [not (win and arm64)]
  commands:
    - pip check
    - pytest -vv {{ deselect_tests }} --pyargs spacy_loggers.tests  # [not (win and arm64)]

about:
  home: https://github.com/explosion/spacy-loggers
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Alternate loggers for spaCy pipeline training
  description: Enables alternatives to spaCy's built-in console logger
  doc_url: https://github.com/explosion/spacy-loggers
  dev_url: https://github.com/explosion/spacy-loggers

extra:
  recipe-maintainers:
    - honnibal
    - ines
    - rspeer
    - adrianeboyd
